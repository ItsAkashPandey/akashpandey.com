<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="spaceGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050b18" />
      <stop offset="45%" stop-color="#1e40af" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Globe Gradient -->
    <linearGradient id="globeGrad" x1="32" y1="18" x2="32" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Satellite Glow -->
    <radialGradient id="satGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#spaceGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Subtle Background Stars -->
  <circle cx="16" cy="16" r="0.8" fill="#ffffff" opacity="0.6" />
  <circle cx="48" cy="48" r="0.6" fill="#ffffff" opacity="0.4" />
  <circle cx="14" cy="44" r="0.7" fill="#ffffff" opacity="0.5" />

  <!-- Back Orbit (behind the globe) -->
  <path d="M51.9 20.5 C 45 14, 25 16, 13.2 40.5" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="3 2" fill="none" opacity="0.6" />

  <!-- The Globe -->
  <circle cx="32" cy="32" r="14" fill="url(#globeGrad)" stroke="#ffffff" stroke-width="2" />

  <!-- Globe Grid Lines (Geospatial theme) -->
  <ellipse cx="32" cy="32" rx="14" ry="5.5" fill="none" stroke="rgba(255, 255, 255, 0.65)" stroke-width="1.5" />
  <ellipse cx="32" cy="32" rx="5.5" ry="14" fill="none" stroke="rgba(255, 255, 255, 0.65)" stroke-width="1.5" />

  <!-- Front Orbit (in front of the globe) -->
  <path d="M13.2 40.5 C 19 47, 39 45, 51.9 20.5" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Satellite Indicator -->
  <circle cx="51.9" cy="20.5" r="5.5" fill="url(#satGlow)" />
  <circle cx="51.9" cy="20.5" r="2.2" fill="#ffffff" />
</svg>
